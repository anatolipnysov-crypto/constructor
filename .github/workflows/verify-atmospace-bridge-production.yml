name: Verify Atmospace bridge production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/constructor-bridge-verify.trigger

permissions:
  contents: read
  issues: write

concurrency:
  group: constructor-atmospace-bridge-production-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production bridge
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm verification trigger
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            grep -qx 'VERIFY_ATMOSPACE_BRIDGE' .github/constructor-bridge-verify.trigger
          fi

      - name: Verify constructor production bridge
        run: |
          set -euo pipefail
          URL="https://constructor-3oa.pages.dev/api/atmospace/generate"

          for attempt in $(seq 1 36); do
            RESPONSE="$(curl -fsS --max-time 15 "${URL}" 2>/dev/null || true)"
            if printf '%s' "${RESPONSE}" | node -e '
              let raw = ""
              process.stdin.setEncoding("utf8")
              process.stdin.on("data", (chunk) => { raw += chunk })
              process.stdin.on("end", () => {
                try {
                  const value = JSON.parse(raw)
                  const ready = value?.ok === true
                    && value?.service === "constructor-atmospace-bridge"
                    && value?.data?.atmospace === "ready"
                    && value?.data?.contract === "landing-runtime-generate-v1"
                  process.exit(ready ? 0 : 1)
                } catch {
                  process.exit(1)
                }
              })
            '; then
              echo "CONSTRUCTOR_ATMOSPACE_BRIDGE=PASS"
              exit 0
            fi

            sleep 10
          done

          echo "CONSTRUCTOR_ATMOSPACE_BRIDGE=FAIL"
          exit 1

      - name: Record bridge success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 12 --repo "${GITHUB_REPOSITORY}" --body "CONSTRUCTOR_ATMOSPACE_BRIDGE=PASS
          SHA=${GITHUB_SHA}
          CLOUDFLARE_PRODUCTION=PASS
          ATMOSPACE_HEALTH=PASS
          CONTRACT=landing-runtime-generate-v1"

      - name: Record bridge failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 12 --repo "${GITHUB_REPOSITORY}" --body "CONSTRUCTOR_ATMOSPACE_BRIDGE=FAIL
          SHA=${GITHUB_SHA}
          ACTION_REQUIRED=inspect_workflow_run"
